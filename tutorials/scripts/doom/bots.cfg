// Named ZDoom bots for the Granite Switch Doom demo, at fixed skill.
// doom_env.BOT_SETS picks seven of these per tier; doom_env points
// +viz_bots_path at this file by absolute path.
//
// Skill fields run 0-100, higher is better: aiming (accuracy), perfection
// (how rarely it makes mistakes), reaction (how fast it responds), isp
// (how well it tracks targets and items).
//
// default: the first seven bots of the bots.cfg shipped in the ViZDoom
// wheel, unchanged, so "default skill" means what ViZDoom ships.

// ── default ──────────────────────────────────────────────────────────────────
